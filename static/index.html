<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串口网络网关</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --border: #3c3c3c; --fg: #d4d4d4;
    --rx: #4ec9b0; --tx: #569cd6; --sys: #808080; --err: #f48771; --accent: #0e639c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px;
         background: var(--panel); border-bottom: 1px solid var(--border); }
  .bar label { color: var(--sys); }
  select, input, button {
    background: #333; color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 8px; font-size: 14px; font-family: inherit; }
  button { cursor: pointer; }
  button:hover { background: #3e3e42; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: #1177bb; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  .dot.on { background: #4caf50; } .dot.off { background: #c0392b; }
  .spacer { flex: 1; }

  #log { flex: 1; overflow-y: auto; padding: 8px 12px; margin: 0;
         font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .line .ts { color: var(--sys); margin-right: 8px; }
  .line .tag { font-weight: bold; margin-right: 8px; }
  .rx .tag { color: var(--rx); } .tx .tag { color: var(--tx); }
  .sys { color: var(--sys); } .err { color: var(--err); }

  .send { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
          background: var(--panel); border-top: 1px solid var(--border); }
  .send input[type=text] { flex: 1; }
  .chk { display: flex; align-items: center; gap: 4px; color: var(--sys); user-select: none; }
</style>
</head>
<body>
  <div class="bar">
    <label>端口</label>
    <select id="port"></select>
    <button id="refresh" title="刷新端口列表">⟳</button>
    <label>波特率</label>
    <select id="baud">
      <option>9600</option><option>19200</option><option>38400</option>
      <option>57600</option><option selected>115200</option><option>230400</option><option>460800</option><option>921600</option>
    </select>
    <button id="toggle" class="primary">打开</button>
    <span class="spacer"></span>
    <label class="chk"><span class="dot" id="wsdot"></span> 服务连接</label>
    <label class="chk"><span class="dot" id="serdot"></span> <span id="serlabel">串口未打开</span></label>
  </div>

  <pre id="log"></pre>

  <div class="bar" style="border-top:1px solid var(--border); border-bottom:none;">
    <label class="chk"><input type="checkbox" id="viewHex"> HEX 视图</label>
    <label class="chk"><input type="checkbox" id="autoscroll" checked> 自动滚屏</label>
    <button id="clear">清屏</button>
  </div>

  <div class="send">
    <input type="text" id="input" placeholder="输入要发送的内容,回车发送…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="sendHex"> HEX</label>
    <label>结尾</label>
    <select id="eol">
      <option value="">无</option>
      <option value="\r">CR</option>
      <option value="\n">LF</option>
      <option value="\r\n" selected>CRLF</option>
    </select>
    <button id="send" class="primary">发送</button>
  </div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let token = params.get("token");
  if (!token) { token = prompt("请输入访问 token:") || ""; }

  let ws = null, serOpen = false, records = [];

  // ---- 渲染 ----
  function fmtTs(ts) {
    const d = new Date(ts * 1000);
    const p = (n, l = 2) => String(n).padStart(l, "0");
    return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
  }
  function renderLine(rec) {
    const hex = $("viewHex").checked;
    const body = rec.kind === "sys" || rec.kind === "err" ? rec.text : (hex ? rec.hex : rec.text);
    const tag = { rx: "RX ←", tx: "TX →", sys: "··", err: "!!" }[rec.kind] || "";
    const div = document.createElement("div");
    div.className = "line " + rec.kind;
    if (rec.kind === "sys" || rec.kind === "err") {
      div.textContent = `[${fmtTs(rec.ts)}] ${body}`;
    } else {
      div.innerHTML = `<span class="ts">${fmtTs(rec.ts)}</span><span class="tag">${tag}</span>` +
                      `<span class="txt"></span>`;
      div.querySelector(".txt").textContent = body;
    }
    return div;
  }
  function redraw() {
    const log = $("log");
    log.innerHTML = "";
    for (const rec of records) log.appendChild(renderLine(rec));
    if ($("autoscroll").checked) log.scrollTop = log.scrollHeight;
  }
  function push(rec) {
    if (!rec.ts) rec.ts = Date.now() / 1000;
    records.push(rec);
    if (records.length > 5000) records = records.slice(-4000);
    const log = $("log");
    log.appendChild(renderLine(rec));
    if ($("autoscroll").checked) log.scrollTop = log.scrollHeight;
  }
  const sys = (t) => push({ kind: "sys", text: t });
  const err = (t) => push({ kind: "err", text: t });

  // ---- 串口状态 UI ----
  function setSerial(status) {
    serOpen = !!status.open;
    $("serdot").className = "dot " + (serOpen ? "on" : "off");
    $("serlabel").textContent = serOpen ? `已打开 ${status.port} @ ${status.baudrate}` : "串口未打开";
    $("toggle").textContent = serOpen ? "关闭" : "打开";
    $("port").disabled = serOpen;
    $("baud").disabled = serOpen;
    if (status.error) err("串口错误: " + status.error);
  }

  // ---- WebSocket ----
  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(token)}`);
    ws.onopen = () => { $("wsdot").className = "dot on"; sys("已连接到网关服务"); };
    ws.onclose = (e) => {
      $("wsdot").className = "dot off";
      if (e.code === 4401) { err("token 无效,连接被拒绝"); return; }
      sys("与服务断开,3 秒后重连…");
      setTimeout(connect, 3000);
    };
    ws.onerror = () => {};
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === "rx" || msg.type === "tx") {
        push({ kind: msg.type, ts: msg.ts, hex: msg.hex, text: msg.text });
      } else if (msg.type === "status") {
        setSerial(msg);
      }
    };
  }

  // ---- 端口列表 ----
  async function loadPorts() {
    try {
      const res = await fetch(`/api/ports`);
      const list = await res.json();
      const sel = $("port");
      const prev = sel.value;
      sel.innerHTML = "";
      if (list.length === 0) {
        const o = document.createElement("option"); o.textContent = "(无可用端口)"; o.value = ""; sel.appendChild(o);
      }
      for (const p of list) {
        const o = document.createElement("option");
        o.value = p.device;
        o.textContent = p.description ? `${p.device} — ${p.description}` : p.device;
        sel.appendChild(o);
      }
      if (prev) sel.value = prev;
    } catch (e) { err("获取端口列表失败: " + e); }
  }

  // ---- 发送 ----
  function doSend() {
    if (!ws || ws.readyState !== WebSocket.OPEN) { err("未连接到服务"); return; }
    if (!serOpen) { err("串口未打开"); return; }
    const hexMode = $("sendHex").checked;
    let data = $("input").value;
    if (!hexMode) data += $("eol").value;   // HEX 模式不追加行结尾
    ws.send(JSON.stringify({ type: "tx", data, encoding: hexMode ? "hex" : "utf8" }));
    $("input").value = "";
  }

  // ---- 事件绑定 ----
  $("toggle").onclick = () => {
    if (serOpen) { ws.send(JSON.stringify({ type: "close" })); }
    else {
      const port = $("port").value;
      if (!port) { err("请先选择端口"); return; }
      ws.send(JSON.stringify({ type: "open", port, baudrate: parseInt($("baud").value, 10) }));
    }
  };
  $("refresh").onclick = loadPorts;
  $("clear").onclick = () => { records = []; $("log").innerHTML = ""; };
  $("viewHex").onchange = redraw;
  $("send").onclick = doSend;
  $("input").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doSend(); } });

  // ---- 启动 ----
  loadPorts();
  connect();
})();
</script>
</body>
</html>
