<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串口网络网关</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --border: #3c3c3c; --fg: #d4d4d4;
    --rx: #d4d4d4; --tx: #569cd6; --sys: #808080; --err: #f48771; --accent: #0e639c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px;
         background: var(--panel); border-bottom: 1px solid var(--border); }
  .bar label { color: var(--sys); }
  select, input, button {
    background: #333; color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 8px; font-size: 14px; font-family: inherit; }
  button { cursor: pointer; }
  button:hover { background: #3e3e42; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: #1177bb; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  .dot.on { background: #4caf50; } .dot.off { background: #c0392b; }
  .spacer { flex: 1; }
  .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 2px; }

  /* 终端区:连续流式输出,像真终端 */
  #term { flex: 1; overflow-y: auto; padding: 8px 12px; margin: 0;
          font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; line-height: 1.45;
          white-space: pre-wrap; word-break: break-all; }
  #term .rx { color: var(--rx); }
  #term .tx { color: var(--tx); }
  #term .meta { display: block; color: var(--sys); font-style: italic; }
  #term .meta.err { color: var(--err); font-style: normal; }

  .send { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
          background: var(--panel); border-top: 1px solid var(--border); }
  .prompt { color: var(--accent); font-family: "Cascadia Code", Consolas, monospace; font-weight: bold; }
  #input { flex: 1; font-family: "Cascadia Code", Consolas, monospace; }
  .chk { display: flex; align-items: center; gap: 4px; color: var(--sys); user-select: none; }
</style>
</head>
<body>
  <!-- 配置工具栏:端口 / 波特率 / 各种选项都在这 -->
  <div class="bar">
    <label>端口</label>
    <select id="port"></select>
    <button id="refresh" title="刷新端口列表">⟳</button>
    <label>波特率</label>
    <select id="baud">
      <option>9600</option><option>19200</option><option>38400</option>
      <option>57600</option><option selected>115200</option><option>230400</option><option>460800</option><option>921600</option>
    </select>
    <button id="toggle" class="primary">打开</button>
    <span class="sep"></span>
    <label>换行</label>
    <select id="eol">
      <option value="none">无</option>
      <option value="cr">CR</option>
      <option value="lf">LF</option>
      <option value="crlf" selected>CRLF</option>
    </select>
    <label class="chk"><input type="checkbox" id="sendHex"> HEX发送</label>
    <label class="chk"><input type="checkbox" id="localEcho"> 本地回显</label>
    <label class="chk"><input type="checkbox" id="ansiColor" checked> ANSI颜色</label>
    <label class="chk"><input type="checkbox" id="viewHex"> HEX视图</label>
    <label class="chk"><input type="checkbox" id="autoscroll" checked> 自动滚屏</label>
    <button id="clear">清屏</button>
    <span class="spacer"></span>
    <label class="chk"><span class="dot" id="wsdot"></span> 服务</label>
    <label class="chk"><span class="dot" id="serdot"></span> <span id="serlabel">串口未打开</span></label>
  </div>

  <div id="term"></div>

  <!-- 命令行:回车即发,↑↓ 翻历史 -->
  <div class="send">
    <span class="prompt">❯</span>
    <input type="text" id="input" placeholder="输入命令,回车发送(↑↓ 翻历史)" autocomplete="off" spellcheck="false">
  </div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  // 换行选项 -> 真实控制字符(HTML 属性里的 \r\n 是字面字符,必须在 JS 里映射)
  const EOL = { none: "", cr: "\r", lf: "\n", crlf: "\r\n" };

  let token = params.get("token") || "";
  let authRequired = false;
  let ws = null, serOpen = false, records = [];
  const history = [];
  let histIdx = -1, draft = "";

  // ---- ANSI 转义码解析 ----
  // 设备(如 RT-Thread msh)会输出 ESC[..m 之类的颜色码。这里把 SGR 颜色码
  // 渲染成对应颜色,其它 CSI 序列(光标移动/清屏)在滚动视图里直接吃掉。
  const ANSI_FG = {
    30: "#666", 31: "#f48771", 32: "#4ec9b0", 33: "#d7ba7d",
    34: "#569cd6", 35: "#c586c0", 36: "#4ec9b0", 37: "#d4d4d4",
    90: "#808080", 91: "#f48771", 92: "#b5cea8", 93: "#dcdcaa",
    94: "#569cd6", 95: "#c586c0", 96: "#9cdcfe", 97: "#ffffff",
  };
  const ansi = { fg: null, bold: false, buf: "" };  // buf: 跨块未收全的转义序列
  function applySGR(paramStr) {
    let codes = paramStr.split(";").filter((x) => x !== "").map(Number);
    if (codes.length === 0) codes = [0];
    for (const c of codes) {
      if (c === 0) { ansi.fg = null; ansi.bold = false; }
      else if (c === 1) ansi.bold = true;
      else if (c === 22) ansi.bold = false;
      else if (c === 39) ansi.fg = null;
      else if (ANSI_FG[c] !== undefined) ansi.fg = ANSI_FG[c];
      // 背景色(40-47/100-107)等暂忽略
    }
  }
  // 返回 [{text, fg, bold}] 段;更新 ansi 状态;不完整的转义序列缓存到下一块
  function feedAnsi(text) {
    const out = [];
    const s = ansi.buf + text;
    ansi.buf = "";
    let i = 0, plain = "";
    const flush = () => { if (plain) { out.push({ text: plain, fg: ansi.fg, bold: ansi.bold }); plain = ""; } };
    while (i < s.length) {
      if (s[i] === "\x1b") {
        const rest = s.slice(i);
        const m = /^\x1b\[([0-9;?]*)([A-Za-z])/.exec(rest);
        if (m) { flush(); if (m[2] === "m") applySGR(m[1]); i += m[0].length; continue; }
        if (/^\x1b\[?[0-9;?]*$/.test(rest)) { ansi.buf = rest; break; }  // 序列没收全,等下一块
        i += 1; continue;  // 不认识的 ESC,跳过 ESC 本身
      }
      plain += s[i]; i++;
    }
    flush();
    return out;
  }

  // ---- 终端渲染 ----
  function appendSpan(box, cls, text, fg, bold) {
    const span = document.createElement("span");
    span.className = cls;
    if (fg) span.style.color = fg;
    if (bold) span.style.fontWeight = "bold";
    span.textContent = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    box.appendChild(span);
  }
  function appendRec(rec) {
    const box = $("term");
    if (rec.kind === "sys" || rec.kind === "err") {
      const div = document.createElement("div");
      div.className = "meta " + rec.kind;
      div.textContent = "— " + rec.text;
      box.appendChild(div);
    } else if ($("viewHex").checked) {
      appendSpan(box, rec.kind, rec.hex + " ", null, false);
    } else if (rec.kind === "rx") {
      const color = $("ansiColor").checked;
      for (const seg of feedAnsi(rec.text)) {
        appendSpan(box, "rx", seg.text, color ? seg.fg : null, color && seg.bold);
      }
    } else {  // tx
      appendSpan(box, "tx", rec.text, null, false);
    }
    if ($("autoscroll").checked) box.scrollTop = box.scrollHeight;
  }
  function redraw() {
    const box = $("term");
    box.innerHTML = "";
    ansi.fg = null; ansi.bold = false; ansi.buf = "";  // 重放前重置解析状态
    for (const r of records) appendRec(r);
  }
  function push(rec) {
    records.push(rec);
    if (records.length > 10000) records = records.slice(-8000);
    appendRec(rec);
  }
  const sys = (t) => push({ kind: "sys", text: t });
  const err = (t) => push({ kind: "err", text: t });

  // ---- 串口状态 UI ----
  function setSerial(status) {
    serOpen = !!status.open;
    $("serdot").className = "dot " + (serOpen ? "on" : "off");
    $("serlabel").textContent = serOpen ? `已打开 ${status.port} @ ${status.baudrate}` : "串口未打开";
    $("toggle").textContent = serOpen ? "关闭" : "打开";
    $("port").disabled = serOpen;
    $("baud").disabled = serOpen;
    if (status.error) err("串口错误: " + status.error);
  }

  // ---- WebSocket ----
  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const q = authRequired ? `?token=${encodeURIComponent(token)}` : "";
    ws = new WebSocket(`${proto}//${location.host}/ws${q}`);
    ws.onopen = () => { $("wsdot").className = "dot on"; sys("已连接到网关服务"); };
    ws.onclose = (e) => {
      $("wsdot").className = "dot off";
      if (e.code === 4401) {
        err("访问密码错误,请重新输入");
        const t = prompt("访问密码错误,请重新输入 token:");
        if (t === null) { err("已取消,未连接"); return; }
        token = t;
        connect();
        return;
      }
      sys("与服务断开,3 秒后重连…");
      setTimeout(connect, 3000);
    };
    ws.onerror = () => {};
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === "rx") {
        push({ kind: "rx", hex: msg.hex, text: msg.text });
      } else if (msg.type === "tx") {
        // 默认不本地回显(设备通常会回显);勾了「本地回显」才显示自己发的
        if ($("localEcho").checked) push({ kind: "tx", hex: msg.hex, text: msg.text });
      } else if (msg.type === "status") {
        setSerial(msg);
      }
    };
  }

  // ---- 端口列表 ----
  async function loadPorts() {
    try {
      const res = await fetch(`/api/ports`);
      const list = await res.json();
      const sel = $("port");
      const prev = sel.value;
      sel.innerHTML = "";
      if (list.length === 0) {
        const o = document.createElement("option"); o.textContent = "(无可用端口)"; o.value = ""; sel.appendChild(o);
      }
      for (const p of list) {
        const o = document.createElement("option");
        o.value = p.device;
        o.textContent = p.description ? `${p.device} — ${p.description}` : p.device;
        sel.appendChild(o);
      }
      if (prev) sel.value = prev;
    } catch (e) { err("获取端口列表失败: " + e); }
  }

  // ---- 发送 ----
  function doSend() {
    if (!ws || ws.readyState !== WebSocket.OPEN) { err("未连接到服务"); return; }
    if (!serOpen) { err("串口未打开"); return; }
    const hexMode = $("sendHex").checked;
    const raw = $("input").value;
    let data = raw;
    if (!hexMode) data += EOL[$("eol").value] || "";   // HEX 模式不追加行结尾
    ws.send(JSON.stringify({ type: "tx", data, encoding: hexMode ? "hex" : "utf8" }));
    if (raw !== "" && history[history.length - 1] !== raw) history.push(raw);
    histIdx = -1; draft = "";
    $("input").value = "";
  }

  // ---- 历史浏览(↑↓)----
  function recallHistory(dir) {
    const inp = $("input");
    if (history.length === 0) return;
    if (histIdx === -1) {
      if (dir < 0) { draft = inp.value; histIdx = history.length - 1; }
      else return;
    } else {
      histIdx += dir;
    }
    if (histIdx >= history.length) { histIdx = -1; inp.value = draft; }
    else if (histIdx < 0) { histIdx = 0; inp.value = history[0]; }
    else { inp.value = history[histIdx]; }
    requestAnimationFrame(() => inp.setSelectionRange(inp.value.length, inp.value.length));
  }

  // ---- 事件绑定 ----
  $("toggle").onclick = () => {
    if (serOpen) { ws.send(JSON.stringify({ type: "close" })); }
    else {
      const port = $("port").value;
      if (!port) { err("请先选择端口"); return; }
      ws.send(JSON.stringify({ type: "open", port, baudrate: parseInt($("baud").value, 10) }));
    }
    $("input").focus();
  };
  $("refresh").onclick = loadPorts;
  $("clear").onclick = () => { records = []; $("term").innerHTML = ""; $("input").focus(); };
  $("viewHex").onchange = redraw;
  $("ansiColor").onchange = redraw;
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); doSend(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); recallHistory(-1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); recallHistory(1); }
  });
  // 点终端区自动聚焦输入框(选中文字复制时不抢焦点)
  $("term").addEventListener("mouseup", () => {
    if (!window.getSelection().toString()) $("input").focus();
  });

  // ---- 启动 ----
  async function init() {
    try {
      const cfg = await (await fetch("/api/config")).json();
      authRequired = !!cfg.auth_required;
    } catch (e) { /* 拿不到就靠连接失败时再提示 */ }
    if (authRequired && !token) token = prompt("请输入访问 token:") || "";
    loadPorts();
    connect();
    $("input").focus();
  }
  init();
})();
</script>
</body>
</html>
