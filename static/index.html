<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串口网络网关</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --border: #3c3c3c; --fg: #d4d4d4;
    --tx: #569cd6; --sys: #808080; --err: #f48771; --accent: #0e639c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px;
         background: var(--panel); border-bottom: 1px solid var(--border); }
  .bar label { color: var(--sys); }
  select, input, button {
    background: #333; color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 8px; font-size: 14px; font-family: inherit; }
  button { cursor: pointer; }
  button:hover { background: #3e3e42; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: #1177bb; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  .dot.on { background: #4caf50; } .dot.off { background: #c0392b; }
  .spacer { flex: 1; }
  .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 2px; }

  /* xterm.js 挂载容器 */
  #term { flex: 1; min-height: 0; padding: 6px 8px; background: var(--bg); overflow: hidden; }
  .xterm { height: 100%; }

  .send { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
          background: var(--panel); border-top: 1px solid var(--border); }
  .prompt { color: var(--accent); font-family: "Cascadia Code", Consolas, monospace; font-weight: bold; }
  #input { flex: 1; font-family: "Cascadia Code", Consolas, monospace; }
  .chk { display: flex; align-items: center; gap: 4px; color: var(--sys); user-select: none; }
  #macrobar { padding: 6px 12px; }
  #macros button { padding: 3px 10px; background: #2d2d30; }
  #macros button:hover { background: #3e3e42; }
  #macros:empty::before { content: "快捷命令(点 ＋ 添加,右键删除)"; color: var(--sys); font-size: 12px; }
</style>
</head>
<body>
  <!-- 配置工具栏 -->
  <div class="bar">
    <label>端口</label>
    <select id="port"></select>
    <button id="refresh" title="刷新端口列表">⟳</button>
    <label>波特率</label>
    <select id="baud">
      <option>9600</option><option>19200</option><option>38400</option>
      <option>57600</option><option selected>115200</option><option>230400</option><option>460800</option><option>921600</option>
    </select>
    <button id="toggle" class="primary">打开</button>
    <span class="sep"></span>
    <label class="chk"><input type="checkbox" id="hl" checked> 错误高亮</label>
    <label class="chk"><input type="checkbox" id="ts" checked> 时间戳</label>
    <button id="find" title="搜索 (Ctrl+F)">🔍</button>
    <button id="save" title="导出日志为 .txt">保存</button>
    <button id="clear">清屏</button>
    <span class="spacer"></span>
    <label class="chk"><span class="dot" id="wsdot"></span> 服务</label>
    <label class="chk"><span class="dot" id="serdot"></span> <span id="serlabel">串口未打开</span></label>
  </div>

  <!-- 搜索栏(Ctrl+F 唤出) -->
  <div class="bar" id="searchbar" style="display:none; border-top:none;">
    <label>搜索</label>
    <input type="text" id="searchInput" placeholder="回车/Enter 下一个,Shift+Enter 上一个" autocomplete="off" style="flex:1; max-width:420px;">
    <label class="chk"><input type="checkbox" id="searchCase"> 区分大小写</label>
    <label class="chk"><input type="checkbox" id="searchRe"> 正则</label>
    <button id="searchPrev">▲ 上一个</button>
    <button id="searchNext">▼ 下一个</button>
    <button id="searchClose">✕</button>
  </div>

  <!-- 快捷命令按钮栏(可自定义,存 localStorage) -->
  <div class="bar" id="macrobar" style="border-top:none; gap:6px;">
    <span id="macros" style="display:flex; flex-wrap:wrap; gap:6px;"></span>
    <button id="macroAdd" title="添加快捷命令">＋</button>
  </div>

  <!-- 实时终端:直接在这里敲,按键(含 Tab/退格/方向键)实时发给设备 -->
  <div id="term"></div>

  <!-- 辅助发送栏:整行/HEX 发送(可选,主要交互直接在上面终端里敲) -->
  <div class="send">
    <span class="prompt">❯</span>
    <input type="text" id="input" placeholder="整行发送(回车)/ 勾 HEX 按十六进制发送;直接在上方终端敲则实时发送" autocomplete="off" spellcheck="false">
    <label class="chk"><input type="checkbox" id="sendHex"> HEX</label>
    <label>结尾</label>
    <select id="eol">
      <option value="none">无</option>
      <option value="cr">CR</option>
      <option value="lf">LF</option>
      <option value="crlf" selected>CRLF</option>
    </select>
    <button id="send" class="primary">发送</button>
  </div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/vendor/addon-search.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const EOL = { none: "", cr: "\r", lf: "\n", crlf: "\r\n" };

  let token = params.get("token") || "";
  let authRequired = false;
  let ws = null, serOpen = false;
  const history = [];
  let histIdx = -1, draft = "";

  // ---- xterm.js 终端 ----
  const term = new Terminal({
    fontFamily: '"Cascadia Code", Consolas, "Courier New", monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 8000,
    theme: { background: "#1e1e1e", foreground: "#d4d4d4", cursor: "#d4d4d4" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  const search = new SearchAddon.SearchAddon();
  term.loadAddon(search);
  term.open($("term"));
  fit.fit();
  window.addEventListener("resize", () => { try { fit.fit(); } catch (e) {} });

  // 系统提示行(灰色斜体),不影响设备数据流
  function sysline(t) { term.writeln("\x1b[90m— " + t + "\x1b[0m"); }
  function errline(t) { term.writeln("\x1b[31m— " + t + "\x1b[0m"); }

  // ---- 错误/警告关键词高亮 ----
  // 在设备数据写入 xterm 前,给常见错误词包上 ANSI 颜色(红=错误,黄=警告)。
  // 按 chunk 处理:分行到达时同一行内的关键词能命中;极少数被拆到两个数据块的
  // 词可能漏高亮(不做跨块缓冲,以免拖住无换行的提示符)。
  const HL_ERR = /\b(error|errors|err|failed|fail|failure|failures|fatal|panic|exception|critical|crit|assert|abort)\b/gi;
  const HL_WARN = /\b(warning|warnings|warn)\b/gi;
  function highlight(s) {
    // 先切开设备已有的 ANSI 转义序列,只在纯文本片段里替换,避免破坏原有颜色码
    return s.split(/(\x1b\[[0-9;?]*[A-Za-z])/).map(function (seg, i) {
      if (i % 2) return seg;                 // 奇数段是 ANSI 转义序列,原样保留
      return seg
        .replace(HL_ERR, function (m) { return "\x1b[1;91m" + m + "\x1b[0m"; })
        .replace(HL_WARN, function (m) { return "\x1b[1;93m" + m + "\x1b[0m"; });
    }).join("");
  }

  // ---- 每行时间戳 ----
  // 在每一行开头插入 [HH:MM:SS.mmm](灰色)。tsPending 跨 chunk 记住「下一个可见
  // 字符是新行的开头」,这样无换行结尾的提示符(msh />)也会被打上时间戳。
  let tsPending = true;
  function tsStr() {
    const d = new Date();
    const p = (n, l) => String(n).padStart(l || 2, "0");
    return "\x1b[90m[" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" +
           p(d.getSeconds()) + "." + p(d.getMilliseconds(), 3) + "]\x1b[0m ";
  }
  function withTimestamps(s) {
    let out = "";
    for (const ch of s) {
      if (tsPending && ch !== "\n" && ch !== "\r") { out += tsStr(); tsPending = false; }
      out += ch;
      if (ch === "\n") tsPending = true;
    }
    return out;
  }

  // 终端里敲的键(xterm 已编码成字节:Tab=\t 退格=\x7f 方向键=ESC[.. 等)直接发串口
  term.onData((data) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (!serOpen) return;
    ws.send(JSON.stringify({ type: "tx", data, encoding: "utf8" }));
  });

  // ---- 串口状态 ----
  function setSerial(status) {
    serOpen = !!status.open;
    $("serdot").className = "dot " + (serOpen ? "on" : "off");
    $("serlabel").textContent = serOpen ? `已打开 ${status.port} @ ${status.baudrate}` : "串口未打开";
    $("toggle").textContent = serOpen ? "关闭" : "打开";
    $("port").disabled = serOpen;
    $("baud").disabled = serOpen;
    if (status.error) errline("串口错误: " + status.error);
    if (serOpen) term.focus();
  }

  // ---- WebSocket ----
  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const q = authRequired ? `?token=${encodeURIComponent(token)}` : "";
    ws = new WebSocket(`${proto}//${location.host}/ws${q}`);
    ws.onopen = () => { $("wsdot").className = "dot on"; sysline("已连接到网关服务"); };
    ws.onclose = (e) => {
      $("wsdot").className = "dot off";
      if (e.code === 4401) {
        errline("访问密码错误,请重新输入");
        const t = prompt("访问密码错误,请重新输入 token:");
        if (t === null) { errline("已取消,未连接"); return; }
        token = t; connect(); return;
      }
      sysline("与服务断开,3 秒后重连…");
      setTimeout(connect, 3000);
    };
    ws.onerror = () => {};
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === "rx") {
        // 设备数据交给 xterm(含 ANSI/退格/光标);可选时间戳 + 错误高亮
        var out = msg.text;
        if ($("hl").checked) out = highlight(out);
        if ($("ts").checked) out = withTimestamps(out);
        term.write(out);
      } else if (msg.type === "tx") {
        // 设备通常会回显自己收到的字符;终端里已由回显呈现,故不再重复写入
      } else if (msg.type === "status") {
        setSerial(msg);
      }
    };
  }

  // ---- 端口列表 ----
  async function loadPorts() {
    try {
      const res = await fetch(`/api/ports`);
      const list = await res.json();
      const sel = $("port");
      const prev = sel.value;
      sel.innerHTML = "";
      if (list.length === 0) {
        const o = document.createElement("option"); o.textContent = "(无可用端口)"; o.value = ""; sel.appendChild(o);
      }
      for (const p of list) {
        const o = document.createElement("option");
        o.value = p.device;
        o.textContent = p.description ? `${p.device} — ${p.description}` : p.device;
        sel.appendChild(o);
      }
      if (prev) sel.value = prev;
    } catch (e) { errline("获取端口列表失败: " + e); }
  }

  // ---- 辅助发送栏:整行/HEX 发送 ----
  function sendLine() {
    if (!ws || ws.readyState !== WebSocket.OPEN) { errline("未连接到服务"); return; }
    if (!serOpen) { errline("串口未打开"); return; }
    const hexMode = $("sendHex").checked;
    const raw = $("input").value;
    let data = raw;
    if (!hexMode) data += EOL[$("eol").value] || "";
    ws.send(JSON.stringify({ type: "tx", data, encoding: hexMode ? "hex" : "utf8" }));
    if (raw !== "" && history[history.length - 1] !== raw) history.push(raw);
    histIdx = -1; draft = "";
    $("input").value = "";
    term.focus();
  }
  function recallHistory(dir) {
    const inp = $("input");
    if (history.length === 0) return;
    if (histIdx === -1) { if (dir < 0) { draft = inp.value; histIdx = history.length - 1; } else return; }
    else { histIdx += dir; }
    if (histIdx >= history.length) { histIdx = -1; inp.value = draft; }
    else if (histIdx < 0) { histIdx = 0; inp.value = history[0]; }
    else { inp.value = history[histIdx]; }
    requestAnimationFrame(() => inp.setSelectionRange(inp.value.length, inp.value.length));
  }

  // ---- 发送一条命令(快捷按钮用),按发送栏的行结尾设置 ----
  function sendCmd(cmd) {
    if (!ws || ws.readyState !== WebSocket.OPEN) { errline("未连接到服务"); return; }
    if (!serOpen) { errline("串口未打开"); return; }
    ws.send(JSON.stringify({ type: "tx", data: cmd + (EOL[$("eol").value] || ""), encoding: "utf8" }));
    term.focus();
  }

  // ---- 导出日志为 .txt(读取 xterm 回滚缓冲,纯文本、无 ANSI) ----
  function saveLog() {
    const buf = term.buffer.active;
    const lines = [];
    for (let i = 0; i < buf.length; i++) lines.push(buf.getLine(i).translateToString(true));
    while (lines.length && lines[lines.length - 1] === "") lines.pop();
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    const name = "serial-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
                 "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + ".txt";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/plain" }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ---- 搜索(addon-search)----
  function searchOpts() {
    return { caseSensitive: $("searchCase").checked, regex: $("searchRe").checked, decorations: {
      matchOverviewRuler: "#d7ba7d", activeMatchColorOverviewRuler: "#e5c07b" } };
  }
  function openSearch() {
    $("searchbar").style.display = "flex";
    $("searchInput").focus();
    $("searchInput").select();
  }
  function closeSearch() { $("searchbar").style.display = "none"; term.focus(); }
  $("find").onclick = openSearch;
  $("searchClose").onclick = closeSearch;
  $("searchNext").onclick = () => search.findNext($("searchInput").value, searchOpts());
  $("searchPrev").onclick = () => search.findPrevious($("searchInput").value, searchOpts());
  $("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); e.shiftKey ? search.findPrevious($("searchInput").value, searchOpts()) : search.findNext($("searchInput").value, searchOpts()); }
    else if (e.key === "Escape") { e.preventDefault(); closeSearch(); }
  });

  // ---- 快捷命令按钮(存 localStorage)----
  const MACRO_KEY = "sb_macros";
  function loadMacros() {
    try { return JSON.parse(localStorage.getItem(MACRO_KEY)) || null; } catch (e) { return null; }
  }
  let macros = loadMacros() || [
    { label: "help", cmd: "help" }, { label: "ps", cmd: "ps" },
    { label: "free", cmd: "free" }, { label: "version", cmd: "version" },
  ];
  function saveMacros() { try { localStorage.setItem(MACRO_KEY, JSON.stringify(macros)); } catch (e) {} }
  function renderMacros() {
    const box = $("macros"); box.innerHTML = "";
    macros.forEach((m, i) => {
      const b = document.createElement("button");
      b.textContent = m.label;
      b.title = m.cmd + "  (右键删除)";
      b.onclick = () => sendCmd(m.cmd);
      b.oncontextmenu = (e) => { e.preventDefault(); if (confirm("删除快捷命令「" + m.label + "」?")) { macros.splice(i, 1); saveMacros(); renderMacros(); } };
      box.appendChild(b);
    });
  }
  $("macroAdd").onclick = () => {
    const cmd = prompt("命令内容(发送时会自动按「结尾」设置补行尾):");
    if (cmd === null || cmd === "") return;
    const label = prompt("按钮显示名:", cmd) || cmd;
    macros.push({ label, cmd }); saveMacros(); renderMacros();
  };
  renderMacros();

  // ---- 事件绑定 ----
  $("toggle").onclick = () => {
    if (serOpen) { ws.send(JSON.stringify({ type: "close" })); }
    else {
      const port = $("port").value;
      if (!port) { errline("请先选择端口"); return; }
      ws.send(JSON.stringify({ type: "open", port, baudrate: parseInt($("baud").value, 10) }));
    }
    term.focus();
  };
  $("refresh").onclick = loadPorts;
  $("save").onclick = saveLog;
  $("clear").onclick = () => { term.clear(); tsPending = true; term.focus(); };
  $("send").onclick = sendLine;
  $("input").addEventListener("keydown", (e) => {
    const inp = $("input");
    if (e.key === "Enter") { e.preventDefault(); sendLine(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); recallHistory(-1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); recallHistory(1); }
    // readline 风格行编辑(让发送栏像 shell 提示符)
    else if (e.ctrlKey && (e.key === "u" || e.key === "U")) {   // 删到行首
      e.preventDefault();
      const c = inp.selectionStart;
      inp.value = inp.value.slice(c);
      inp.setSelectionRange(0, 0);
    } else if (e.ctrlKey && (e.key === "k" || e.key === "K")) { // 删到行尾
      e.preventDefault();
      const c = inp.selectionStart;
      inp.value = inp.value.slice(0, c);
      inp.setSelectionRange(c, c);
    } else if (e.ctrlKey && (e.key === "w" || e.key === "W")) { // 删前一个词
      e.preventDefault();
      const c = inp.selectionStart;
      const left = inp.value.slice(0, c).replace(/\s*\S+\s*$/, "");
      inp.value = left + inp.value.slice(c);
      inp.setSelectionRange(left.length, left.length);
    } else if (e.ctrlKey && (e.key === "a" || e.key === "A")) { // 光标到行首
      e.preventDefault(); inp.setSelectionRange(0, 0);
    } else if (e.ctrlKey && (e.key === "e" || e.key === "E")) { // 光标到行尾
      e.preventDefault(); inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  });
  // Ctrl+F 唤出搜索(拦截浏览器默认查找)
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === "f" || e.key === "F")) {
      e.preventDefault(); openSearch();
    }
  });

  // ---- 启动 ----
  async function init() {
    try {
      const cfg = await (await fetch("/api/config")).json();
      authRequired = !!cfg.auth_required;
    } catch (e) { /* 拿不到就靠连接失败时再提示 */ }
    if (authRequired && !token) token = prompt("请输入访问 token:") || "";
    loadPorts();
    connect();
    term.focus();
  }
  init();
})();
</script>
</body>
</html>
